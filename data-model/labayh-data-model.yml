core_traversal_examples:
- goal: List consultants in a given specialty
  steps:
  - GET /wp/v2/consultant_categories?per_page=100 — find the term id
  - GET /wp/v2/consultant?consultant_categories=<term_id>&_embed
- goal: Render a consultant card with portrait
  steps:
  - GET /wp/v2/consultant/{id}?_embed
  - Read _embedded['wp:featuredmedia'][0].source_url for the portrait
- goal: Browse therapeutic programmes
  steps:
  - GET /wp/v2/program?per_page=10&_embed
  - GET /wp/v2/program_categories to label them
