description: 'Entity-relationship graph for the Labayh Content API, derived from the OpenAPI schemas and
  the taxonomy registrations observed on the live site. The graph has two halves: a domain half (consultants,
  programmes, support groups, webinars and their specialty taxonomies) that is specific to Labayh''s mental-health
  catalogue, and a generic publishing half (posts, pages, media, comments, users) inherited from WordPress.
  Every content entity follows the same shape — integer id, slug, title/content/excerpt rendered objects,
  featured_media pointer, and an array of taxonomy term ids.'
conventions:
  identifier: Integer `id`, unique per content type. `slug` is a stable human-readable alternate key.
  rendered_fields: 'title, content and excerpt are objects of the form {rendered: ''<html>''}, not plain
    strings. Agents must read .rendered and strip HTML.'
  traversal: Relationships are expressed as bare integer IDs plus a _links object. Pass _embed on a request
    to inline featured media, author and taxonomy terms in one round trip instead of following each id.
  no_join: There is no server-side join or expansion beyond _embed; deep graphs need N+1 calls.
