aid: labayh
name: Labayh
description: >-
  Labayh (لبيه) is a Saudi Arabian digital mental-health platform delivering online psychological,
  psychiatric and family counselling to the Arabic-speaking Gulf market. Patients book scheduled or
  instant video and audio sessions with more than 1,000 licensed specialists, and can also enrol in
  structured therapeutic programs for depression, anxiety, OCD and social phobia, join peer support
  groups, take psychological assessments, track mood daily, and watch live and recorded webinars.
  The company reports over 70 million minutes of consultation delivered. Alongside the consumer app
  it runs Labayh Business, a corporate employee-wellbeing arm, and Labayh Academy, a training
  platform for practitioners. Labayh is backed by 500 Global. It operates no developer program and
  publishes no OpenAPI, SDKs or developer portal; the API catalogued here is the anonymously
  readable WordPress REST surface behind labayh.net, whose OpenAPI description API Evangelist
  derived from the server's own discovery document.
