        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createRecordedWebinarCategory
      summary: Create a recorded webinar categorie
      description: Requires an authenticated WordPress user with sufficient capability.
      tags:
      - Webinars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordedWebinarCategory'
      responses:
        '201':
