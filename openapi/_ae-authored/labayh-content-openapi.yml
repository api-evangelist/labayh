        required: false
        schema:
          type: string
        description: كلمة مرور المقالة إذا كانت محمية بكلمة مرور.
      responses:
        '200':
          description: The requested item.
          content:
            application/json:
              schema: *id001
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateConsultant
      summary: Update a consultant item
      description: Requires an authenticated WordPress user with sufficient capability.
      tags:
