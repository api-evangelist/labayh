  /wp/v2/users:
    get:
      operationId: listUsers
      summary: List users
      description: Public author profiles.
      tags:
      - Content
      security: []
      parameters:
      - name: capabilities
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: حصر مجموعة النتائج على المستخدمين الذين تطابق صلاحياتهم صلاحية واحدة على الأقل. يمكن استخدام قائمة csv أو صلاحية مفردة.
