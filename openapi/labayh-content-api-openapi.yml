components:
  responses:
    Forbidden:
      description: The authenticated user is not allowed to perform this action (rest_forbidden).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No resource matched the supplied identifier (rest_no_route / rest_post_invalid_id).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid parameter (rest_invalid_param).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required (rest_not_logged_in).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    User:
      type: object
      title: user
      properties:
        id:
          type: integer
          description: مُعرف فريد للمستخدم.
        username:
          type: string
          description: اسم الدخول للمستخدم.
        name:
          type: string
          description: اسم العرض للمستخدم.
        first_name:
          type: string
          description: الاسم الأول للمستخدم.
        last_name:
          type: string
          description: الاسم الأخير للمستخدم.
        email:
          type: string
          format: email
          description: عنوان البريد الإلكتروني للمستخدم.
        url:
          type: string
          format: uri
          description: رابط المستخدم.
        description:
          type: string
          description: وصف المستخدم.
        link:
          type: string
          format: uri
          description: رابط المستخدم ككاتب.
        locale:
          type: string
          enum:
          - ''
          - en_US
          - ar
          - en_GB
          description: لغة المستخدم المحلية.
        nickname:
          type: string
          description: الاسم المستعار لهذا المستخدم.
        slug:
          type: string
          description: مُعرف أبجدي رقمي للمستخدم.
        registered_date:
          type: string
          format: date-time
          description: تاريخ تسجيل المستخدم.
        roles:
          type: array
          description: الأدوار المُسندة للمستخدم.
          items:
            type: string
        password:
          type: string
          description: كلمة مرور المستخدم (ﻻ يتم تضمينها أبدًا).
        capabilities:
          type: object
          description: كل الصلاحيات المُسندة للمستخدم.
          additionalProperties: true
        extra_capabilities:
          type: object
          description: أي صلاحيات إضافية مُسندة للمستخدم.
          additionalProperties: true
        avatar_urls:
          type: object
          description: رابط الصورة الرمزية للمستخدم.
          properties:
            '24':
              type: string
              format: uri
              description: رابط صورة رمزية مع صور بحجم 24 بكسل.
            '48':
              type: string
              format: uri
              description: رابط صورة رمزية مع صور بحجم 48 بكسل.
            '96':
              type: string
              format: uri
              description: رابط صورة رمزية مع صور بحجم 96 بكسل.
        meta:
          type: object
          description: الحقول الإضافية.
          properties:
            persisted_preferences:
              type: object
              properties:
                _modified:
                  type: string
                  format: date-time
                  description: التاريخ والوقت التي تم حفظ التفضيلات فيه.
    MediaItem:
      type: object
      title: attachment
      properties:
        date:
          type: string
          format: date-time
          description: تاريخ نشر المقالة، بتوقيت الموقع.
        date_gmt:
          type: string
          format: date-time
          description: تاريخ نشر المقالة، بتوقيت GMT.
        guid:
          type: object
          description: المُعرف العمومي الفريد للمقالة.
          properties:
            raw:
              type: string
              description: مُعرف (GUID) للمقالة، كما هو موجود في قاعدة البيانات.
            rendered:
              type: string
              description: مُعرف (GUID) للمقالة، مُعد للعرض.
        id:
          type: integer
          description: مُعرف فريد للمقالة.
        link:
          type: string
          format: uri
          description: رابط URL للمقالة.
        modified:
          type: string
          format: date-time
          description: تاريخ آخر تعديل للمقالة، بتوقيت الموقع.
        modified_gmt:
          type: string
          format: date-time
          description: تاريخ آخر تعديل للمقالة، بتوقيت GMT.
        slug:
          type: string
          description: مُعرف أبجدي رقمي للمقالة فريد من نوعه.
        status:
          type: string
          enum:
          - publish
          - future
          - draft
          - pending
          - private
          - acf-disabled
          description: حالة مُسماة للمقالة.
        type:
          type: string
          description: نوع المقالة.
        permalink_template:
          type: string
          description: قالب الرابط الدائم للمقالة.
        generated_slug:
          type: string
          description: يتم إنشاء الاسم اللطيف تلقائيًا من عنوان المقالة.
        class_list:
          type: array
          description: مجموعة من أسماء الفئات الخاصة بعنصر حاوية التدوينات.
          items:
            type: string
        title:
          type: object
          description: عنوان المقالة.
          properties:
            raw:
              type: string
              description: عنوان للمقالة، كما هو موجود في قاعدة البيانات.
            rendered:
              type: string
              description: عنوان HTML للمقالة، مُعد للعرض.
        author:
          type: integer
          description: مُعرف كاتب المقالة.
        featured_media:
          type: integer
          description: مُعرف الوسائط المميزة للمقالة.
        comment_status:
          type: string
          enum:
          - open
          - closed
          description: ما إذا كانت التعليقات مفتوحة على المقالة.
        ping_status:
          type: string
          enum:
          - open
          - closed
          description: ما إذا كانت هناك إمكانية لإرسال التنبيهات للمقالة.
        meta:
          type: object
          description: الحقول الإضافية.
          additionalProperties: true
        template:
          type: string
          description: ملف القالب الذي سُيستخدم لعرض المقالة.
        alt_text:
          type: string
          description: النص البديل المعروض عندما لا يتم عرض المرفق.
        caption:
          type: object
          description: شرح المرفق.
          properties:
            raw:
              type: string
              description: الكلمات التوضيحية للمرفق، كما هي في قاعدة البيانات.
            rendered:
              type: string
              description: كلمات توضيحية (HTML) للمرفق، مُعدة للعرض.
        description:
          type: object
          description: وصف المرفق.
          properties:
            raw:
              type: string
              description: وصف المرفق، كما هو موجود في قاعدة البيانات.
            rendered:
              type: string
              description: وصف HTML للمرفق، مُعد للعرض.
        media_type:
          type: string
          enum:
          - image
          - file
          description: نوع المرفق.
        mime_type:
          type: string
          description: نوع (MIME) المرفق.
        media_details:
          type: object
          description: تفاصيل حول ملف الوسائط، خاصة بنوعه.
          additionalProperties: true
        post:
          type: integer
          description: مُعرف المقالة المرتبطة بالمرفق.
        source_url:
          type: string
          format: uri
          description: رابط ملف المرفق الأصلي.
        missing_image_sizes:
          type: array
          description: قائمة أحجام الصور المفقودة من المرفق.
          items:
            type: string
        filename:
          type: string
          description: اسم ملف المرفق الأصلي.
        filesize:
          type: integer
          description: حجم ملف المرفق بالبايت.
        exif_orientation:
          type: integer
          description: قيمة اتجاه EXIF. القيم من 1 إلى 8 تتبع مواصفات EXIF، حيث يعني 1 عدم الحاجة إلى التدوير.
    Error:
      type: object
      title: Error
      description: The WordPress REST error envelope returned on every 4xx/5xx response.
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. rest_post_invalid_id.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          description: Additional error context.
          properties:
            status:
              type: integer
              description: The HTTP status code.
            params:
              type: object
              additionalProperties: true
              description: Per-parameter validation messages.
    Comment:
      type: object
      title: comment
      properties:
        id:
          type: integer
          description: مُعرف فريد للتعليق.
        author:
          type: integer
          description: مُعرف المستخدم، إذا كان الكاتب موجود كمُستخدم.
        author_email:
          type: string
          format: email
          description: عنوان البريد الإلكتروني لكاتب التعليق.
        author_ip:
          type: string
          format: ip
          description: عنوان الـ IP لكاتب التعليق.
        author_name:
          type: string
          description: اسم العرض لكاتب التعليق.
        author_url:
          type: string
          format: uri
          description: رابط URL لكاتب التعليق.
        author_user_agent:
          type: string
          description: وكيل المستخدم (User Agent) لكاتب التعليق.
        content:
          type: object
          description: محتوى التعليق.
          properties:
            raw:
              type: string
              description: محتوى التعليق، كما هو موجود في قاعدة البيانات.
            rendered:
              type: string
              description: محتوى HTML للتعليق، مُعد للعرض.
        date:
          type: string
          format: date-time
          description: تاريخ نشر التعليق، بتوقيت الموقع.
        date_gmt:
          type: string
          format: date-time
          description: تاريخ نشر التعليق، بتوقيت GMT.
        link:
          type: string
          format: uri
          description: رابط إلى التعليق.
        parent:
          type: integer
          description: المعرّف الرئيسي (الأب) للتعليق.
        post:
          type: integer
          description: مُعرف كائن المقالة المرتبطة.
        status:
          type: string
          description: حالة التعليق.
        type:
          type: string
          description: نوع التعليق.
        author_avatar_urls:
          type: object
          description: رابط الصورة الرمزية لكاتب التعليق.
          properties:
            '24':
              type: string
              format: uri
              description: رابط صورة رمزية مع صور بحجم 24 بكسل.
            '48':
              type: string
              format: uri
              description: رابط صورة رمزية مع صور بحجم 48 بكسل.
            '96':
              type: string
              format: uri
              description: رابط صورة رمزية مع صور بحجم 96 بكسل.
        meta:
          type: object
          description: الحقول الإضافية.
          properties:
            _wp_note_status:
              type: string
              enum:
              - resolved
              - reopen
              description: حالة حل الملاحظة
    Page:
      type: object
      title: page
      properties:
        date:
          type: string
          format: date-time
          description: تاريخ نشر المقالة، بتوقيت الموقع.
        date_gmt:
          type: string
          format: date-time
          description: تاريخ نشر المقالة، بتوقيت GMT.
        guid:
          type: object
          description: المُعرف العمومي الفريد للمقالة.
          properties:
            raw:
              type: string
              description: مُعرف (GUID) للمقالة، كما هو موجود في قاعدة البيانات.
            rendered:
              type: string
              description: مُعرف (GUID) للمقالة، مُعد للعرض.
        id:
          type: integer
          description: مُعرف فريد للمقالة.
        link:
          type: string
          format: uri
          description: رابط URL للمقالة.
        modified:
          type: string
